app {
  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8081
    port = ${?HTTP_PORT}
    timeout = 40 seconds
    timeout = ${?HTTP_TIMEOUT}
  }
  redis {
    uri = "redis://localhost:6379"
    uri = ${?REDIS_URI}
  }
  rates {
    program {
      rates-cache-namespace: "rates"
      rates-cache-namespace: ${?RATES_CACHE_NAMESPACE}
      rates-polling-timeout: 1 minutes
      rates-polling-timeout = ${?RATES_POLLING_TIMEOUT}
      currencies: [
        "USD", "EUR", "JPY", "GBP", "AUD", "CAD"
      ]
    }
    oneframe {
      base-uri = "http://localhost:8080"
      base-uri = ${?ONEFRAME_BASE_URI}
      token = "10dc303535874aeccc86a8251e6992f5"
      token = ${?ONEFRAME_TOKEN}
      rates-path = "/rates"
      rates-path = ${?ONEFRAME_RATES_PATH}
    }
  }
  cache {
    lock-key: "rates-lock"
    lock-key: ${?CACHE_LOCK_KEY}
    lock-ttl: 1 minutes
    lock-ttl: ${?CACHE_LOCK_TTL}
  }
}

